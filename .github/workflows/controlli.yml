name: Controlli
on:
  pull_request:
jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Controlli prima della pubblicazione
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/controlli.js
